name: Nginap CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Report dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); console.log("npm audit summary:", JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name, v] of Object.entries(a.vulnerabilities ?? {})) console.log(name + ": " + v.severity + " | range=" + v.range + " | via=" + JSON.stringify(v.via) + " | fixAvailable=" + JSON.stringify(v.fixAvailable));'
      - name: Enforce dependency security audit
        run: npm audit --audit-level=moderate
      - run: npm run test --workspace @nginap/local-server
      - run: npm run typecheck
      - run: npm run build
