name: Generate dependency lockfile

on:
  push:
    branches: ["security/**"]

permissions:
  contents: write

concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lockfile:
    if: ${{ !hashFiles('package-lock.json') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate reviewed dependency resolution
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to the security branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(deps): add npm lockfile for reproducible installs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
